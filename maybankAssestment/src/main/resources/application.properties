spring.application.name=maybankAssestment
server.port=${SERVER_PORT:8080}

# ---------- Database (MSSQL, local TESTDB) ----------
# Password comes from the DB_PASSWORD environment variable (never commit it)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=TESTDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Pagination: 10 records per page ----------
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=10

# ---------- CORS (React dev server) ----------
app.cors.allowed-origins=http://localhost:5173

# ---------- 3rd-party API ----------
thirdparty.weather.base-url=https://api.open-meteo.com/v1
